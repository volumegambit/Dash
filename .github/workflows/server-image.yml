name: Server image

# Builds deploy/server/Dockerfile (hosted relay + control plane).
#  - Called by deploy-staging.yml and release.yml with push: true.
#  - Runs build-only on pull requests that touch the image's inputs, which is
#    the only Docker validation the project has (no Docker on the dev Mac).
on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      ref:
        type: string
        default: ''
      tags:
        description: Extra image tags, one per line (sha-<short> is always added)
        type: string
        default: ''
    outputs:
      image:
        description: Immutable image reference (sha tag)
        value: ${{ jobs.build.outputs.image }}
  pull_request:
    branches: [main]
    paths:
      - deploy/server/**
      - apps/relay/**
      - apps/relay-control-plane/**
      - packages/logging/**
      - package.json
      - package-lock.json
      - .dockerignore
      - .github/workflows/server-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Image name and tags
        id: meta
        env:
          EXTRA_TAGS: ${{ inputs.tags }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dash-server"
          short="$(git rev-parse --short=7 HEAD)"
          echo "image=${repo}:sha-${short}" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "${repo}:sha-${short}"
            printf '%s\n' "$EXTRA_TAGS" | sed '/^$/d' | sed "s#^#${repo}:#"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server/Dockerfile
          push: ${{ inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/mc-vps-gateway-relay]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run mobile:contract-check

      - run: npm run lint

      # Hard-fails the build at 60 days since the oldest catalog `reviewedAt`.
      # Warns at 30 days. To unblock, run `/update-models` (or
      # `npm run models:audit:apply`) and commit the refreshed bundled
      # catalogs (apps/gateway/plugins/dash-core-providers/providers/*.json).
      - run: npm run models:check

      - run: npm test

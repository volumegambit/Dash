openapi: 3.1.0
info:
  title: Dash Mobile Conversation Sync API
  version: 1.0.0
  description: Frozen version 1 wire contract for Dash mobile clients.
servers:
  - url: /mobile/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getMobileHealth
      security: []
      responses:
        '200':
          description: Gateway health and mobile capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileHealth'
  /identity:
    get:
      operationId: getGatewayIdentity
      responses:
        '200':
          description: Stable gateway relay identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /agents:
    get:
      operationId: listMobileAgents
      responses:
        '200':
          description: Secret-stripped registered agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAgentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createMobileAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMobileAgentRequest'
      responses:
        '201':
          description: Created agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAgent'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /agents/{id}/skills:
    get:
      operationId: listMobileAgentSkills
      description: >-
        Read-only view of the skills an agent can load, including any it learned
        for itself. Mobile clients cannot create, install, edit or remove
        skills; those routes stay on the loopback management namespace.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Skills visible to this agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSkillList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: getMobileAgent
      responses:
        '200':
          description: Secret-stripped registered agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAgent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateMobileAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMobileAgentRequest'
      responses:
        '200':
          description: Updated agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAgent'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMobileAgent
      responses:
        '200':
          description: Agent deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      operationId: enableMobileAgent
      responses:
        '200':
          description: Agent enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      operationId: disableMobileAgent
      responses:
        '200':
          description: Agent disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  # The three memory operations answer 404 with `MemoryNotFound`, NOT the
  # `NotFound` (`MobileApiError`) envelope every other operation in this
  # namespace uses. That is deliberate: the gateway handlers emit the bare
  # `{ "error": "not found" }` body, and this document describes what is
  # actually on the wire. See the `MemoryNotFound` response for the full note.
  /agents/{id}/memory:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: listMobileAgentMemories
      responses:
        '200':
          description: Memories the agent has saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryInfoList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
  /agents/{id}/memory/{name}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/MemoryName'
    get:
      operationId: getMobileAgentMemory
      responses:
        '200':
          description: The full memory record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
    delete:
      operationId: deleteMobileAgentMemory
      responses:
        '200':
          description: The deleted memory's name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
  /agents/{id}/subagent-types:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: listMobileSubagentTypes
      description: >-
        The sub-agent roster this agent can spawn: built-ins, plugin `agents/*.md`,
        the per-agent definition dir and the workspace dirs, merged by precedence and
        narrowed by `subagents.allowedTypes`. Entries that LOST a name collision are
        listed immediately after their winner carrying `shadowedBy`. `systemPrompt` is
        deliberately absent — fetch the definition body when it is actually needed.
      responses:
        '200':
          description: Resolved sub-agent roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentTypesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{id}/subagent-definitions:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: listMobileSubagentDefinitions
      description: >-
        The `*.md` files in this agent's own definition directory — the only writable
        layer. Workspace and plugin definitions are read-only and appear in the roster.
      responses:
        '200':
          description: Per-agent definition files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentDefinitionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{id}/subagent-definitions/{name}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/SubagentDefinitionName'
    get:
      operationId: getMobileSubagentDefinition
      responses:
        '200':
          description: The definition's raw markdown, byte-for-byte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentDefinition'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putMobileSubagentDefinition
      description: >-
        Create or replace `<name>.md` in the agent's definition dir. The body is parsed
        before anything is written; the frontmatter `name` must equal the path `name`
        (the roster keys on the former and this API addresses the latter, so a
        divergence produces a definition no client can address).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSubagentDefinitionRequest'
      responses:
        '200':
          description: Definition written and the agent's roster invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentDefinitionWriteResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteMobileSubagentDefinition
      responses:
        '200':
          description: Definition removed and the agent's roster invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentDefinitionWriteResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /models:
    get:
      operationId: listMobileModels
      responses:
        '200':
          description: Models available to mobile agent configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /conversations:
    get:
      operationId: listConversations
      parameters:
        - $ref: '#/components/parameters/ConversationAgentId'
        - $ref: '#/components/parameters/ConversationLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of conversation summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreateRequest'
      responses:
        '201':
          description: Created conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: getConversation
      responses:
        '200':
          description: Current conversation summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchConversation
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationPatchRequest'
      responses:
        '200':
          description: Updated conversation summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Revision conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionConflictError'
        '410':
          $ref: '#/components/responses/Gone'
    delete:
      operationId: deleteConversation
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Revisioned conversation tombstone after content deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conversation has an active turn or the revision is stale.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RevisionConflictError'
                  - $ref: '#/components/schemas/ConversationBusyError'
        '410':
          $ref: '#/components/responses/Gone'
  /conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listConversationMessages
      parameters:
        - $ref: '#/components/parameters/MessageLimit'
        - $ref: '#/components/parameters/BeforeCursor'
      responses:
        '200':
          description: A stable page of persisted messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessagePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{id}/subagents:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listConversationSubagents
      description: >-
        The conversation's sub-agents, oldest first. Enough to render a tasks panel
        without fetching a child transcript. `report` is SCANNED before it leaves the
        gateway (control tags neutralized, role prefixes escaped) because it is
        sub-agent output a client renders directly.
      responses:
        '200':
          description: The conversation's children.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /subagents/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/SubagentId'
    post:
      operationId: stopSubagent
      description: >-
        Cancel the sub-agent and every descendant beneath it, leaves first. 409 when it
        has already reached a terminal status — a client that raced the child's own
        finish learns which of the two won rather than getting a silent success.
      responses:
        '200':
          description: The sub-agent (and its descendants) were cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentStopResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ValidationFailed'
  /subagents/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/SubagentId'
    post:
      operationId: resumeSubagent
      description: >-
        Send a message to the sub-agent from its parent — the same call the `send_message`
        tool makes, so the child can never be widened past what the tool would have
        granted it. A RUNNING child queues the message as its next turn; a FINISHED one
        (including one interrupted by a gateway restart) is resumed on its own
        conversation. 409 for a one-shot type, a child at its steer cap, and a child
        whose grant can no longer be rebuilt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubagentResumeRequest'
      responses:
        '200':
          description: The message was queued or the sub-agent was resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentResumeResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ValidationFailed'
  /agents/{agentId}/conversations/{conversationId}/events:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - name: conversationId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConversationIdentifier' }
    get:
      operationId: replayConversationEvents
      parameters:
        - name: sinceSeq
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Replay entries strictly after sinceSeq.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /events:
    get:
      operationId: streamConversationChanges
      responses:
        '200':
          description: Server-sent conversation cache invalidation events.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ConversationChangedEvent'
                  - $ref: '#/components/schemas/ConversationDeletedEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /speech/config:
    get:
      operationId: getSpeechConfig
      summary: The gateway's persisted speech configuration and provider availability.
      responses:
        '200':
          description: Current speech configuration plus per-provider availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: patchSpeechConfig
      summary: Merge a partial speech configuration and return the merged result.
      description: >-
        A shallow per-section merge: an omitted key keeps its current value. Sending an
        unknown key anywhere in the body is a 400, not a silent drop. The response body
        is identical in shape to `GET /speech/config`, so a client never needs a second
        round-trip to learn what it now has.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechConfigPatch'
      responses:
        '200':
          description: Merged speech configuration plus per-provider availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechConfigResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /speech/models:
    get:
      operationId: listSpeechModels
      summary: Models the configured provider offers for one speech kind.
      parameters:
        - $ref: '#/components/parameters/SpeechModelKind'
      responses:
        '200':
          description: Models for the requested kind, cached one hour per provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechModelList'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/SpeechUpstreamFailed'
        '503':
          $ref: '#/components/responses/SpeechUnavailable'
  /speech/transcriptions:
    post:
      operationId: createSpeechTranscription
      summary: Transcribe one recorded clip.
      description: >-
        The clip is inlined as base64 rather than multipart so the request stays a plain
        JSON body on every client. Upstream limits are hard: the DECODED audio must be at
        most 8 MiB (413 `too_large`) and the clip at most 60 seconds. The gateway also
        fast-rejects on `Content-Length` above 12 MB before reading the body at all, so an
        oversized upload is refused without being buffered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptionRequest'
      responses:
        '200':
          description: The transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/SpeechPayloadTooLarge'
        '502':
          $ref: '#/components/responses/SpeechUpstreamFailed'
        '503':
          $ref: '#/components/responses/SpeechUnavailable'
  /speech/speech:
    post:
      operationId: createSpeechSynthesis
      summary: Synthesize speech, streamed as MPEG audio, or PCM-only models are a WAV response.
      description: >-
        The ONLY operation in this namespace whose success body is not JSON. The gateway
        pins the format to `mp3` (this route always feeds a file player) and streams the
        provider's bytes through without buffering. A PCM-only provider (e.g. Gemini TTS)
        cannot honor that request and answers `audio/wav` instead, buffered whole rather
        than streamed. An error raised before the first audio chunk still becomes a JSON
        `MobileApiError`, which is why a client must send an `Accept` that admits all three:
        `audio/mpeg, audio/wav`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynthesisRequest'
      responses:
        '200':
          description: MPEG audio, streamed, or WAV audio, whole, for a PCM-only model.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/SpeechPayloadTooLarge'
        '502':
          $ref: '#/components/responses/SpeechUpstreamFailed'
        '503':
          $ref: '#/components/responses/SpeechUnavailable'
  /ws-ticket:
    post:
      operationId: createWsTicket
      summary: Mint a single-use, short-lived WebSocket upgrade ticket.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ticket created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AgentId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    MemoryName:
      name: name
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ConversationId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ConversationIdentifier' }
    ConversationAgentId:
      name: agentId
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    ConversationLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    MessageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    BeforeCursor:
      name: before
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"(0|[1-9][0-9]*)"$' }
    SubagentId:
      name: id
      in: path
      required: true
      description: A child conversation id (`sub_<ulid>`); it is also the sub-agent's id.
      schema: { $ref: '#/components/schemas/ConversationIdentifier' }
    SubagentDefinitionName:
      name: name
      in: path
      required: true
      description: >-
        The definition's file stem. Same grammar the frontmatter `name` must match, which
        is also what keeps a path separator, a dot segment or a NUL out of the resolved
        file path.
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
    SpeechModelKind:
      name: kind
      in: query
      required: true
      description: >-
        Required, with no default: the route answers 400 `validation_failed` when it is
        absent or is anything but these two values.
      schema: { enum: [transcription, speech] }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MobileApiError'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MobileApiError'
    MemoryNotFound:
      description: >-
        The agent, or the named memory, does not exist. DELIBERATE DIVERGENCE:
        the memory routes reply with the gateway's bare `{ "error": ... }` body
        instead of the `MobileApiError` envelope the rest of this namespace
        uses, so they are documented with their own schema rather than
        `NotFound`. Clients must not expect `code`/`retryable` here; iOS maps
        the 404 status before it reads the body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryNotFoundError'
    Gone:
      description: The conversation was previously deleted and cannot be mutated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MobileApiError'
    ValidationFailed:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MobileApiError'
    SpeechPayloadTooLarge:
      description: >-
        The request exceeded an upstream hard limit — `too_large` for audio over 8 MiB
        decoded (or a `Content-Length` over 12 MB), `too_long` for synthesis input over
        4 000 characters. Never retryable as sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MobileApiError'
    SpeechUpstreamFailed:
      description: >-
        The speech provider refused or the call to it failed — `provider` or `network`.
        `network` is marked retryable; `provider` is not.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MobileApiError'
    SpeechUnavailable:
      description: >-
        No provider is configured for this kind (`unavailable`). Retryable: a credential
        added in Mission Control makes the same request succeed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MobileApiError'
  schemas:
    MobileHealth:
      type: object
      additionalProperties: false
      required: [status, startedAt, pid, agents, channels, apiVersion, capabilities]
      properties:
        status: { const: healthy }
        startedAt: { type: string, format: date-time }
        pid: { type: integer, minimum: 1 }
        agents: { type: integer, minimum: 0 }
        channels: { type: integer, minimum: 0 }
        apiVersion: { const: 1 }
        capabilities:
          type: array
          uniqueItems: true
          items: { enum: [conversation-sync-v1, chat-resume-v1, speech-v1] }
    GatewayIdentity:
      type: object
      additionalProperties: false
      required: [gatewayId, publicKey]
      properties:
        gatewayId: { type: string, minLength: 1 }
        publicKey: { type: string, minLength: 1 }
    PairingPayload:
      oneOf:
        - type: object
          additionalProperties: true
          $comment: Clients trim mgmtToken and chatToken before requiring equality and storing one phone-scoped capability.
          required: [v, host, secure, mgmtToken, chatToken, relayCredential]
          properties:
            v: { const: 2 }
            host:
              type: string
              minLength: 1
              pattern: '^(?![A-Za-z][A-Za-z0-9+.-]*:)[^\s/\\?#@%]+$'
            secure: { const: true }
            mgmtToken: { type: string, minLength: 1, pattern: '.*\S.*' }
            chatToken: { type: string, minLength: 1, pattern: '.*\S.*' }
            relayCredential: { type: string, minLength: 1, pattern: '.*\S.*' }
        - type: object
          additionalProperties: true
          $comment: Clients trim mgmtToken and chatToken before requiring equality; mgmtPort and chatPort are equal.
          required:
            [
              v,
              host,
              secure,
              mgmtToken,
              chatToken,
              mgmtPort,
              chatPort,
              tlsCertificateSha256,
            ]
          properties:
            v: { const: 3 }
            host:
              type: string
              minLength: 1
              pattern: '^(?![A-Za-z][A-Za-z0-9+.-]*:)[^\s/\\?#@%]+$'
            secure: { const: true }
            mgmtToken: { type: string, minLength: 1, pattern: '.*\S.*' }
            chatToken: { type: string, minLength: 1, pattern: '.*\S.*' }
            mgmtPort: { type: integer, minimum: 1, maximum: 65535 }
            chatPort: { type: integer, minimum: 1, maximum: 65535 }
            tlsCertificateSha256:
              type: string
              pattern: '^[A-Fa-f0-9]{64}$'
    MobileAgent:
      type: object
      additionalProperties: false
      required: [id, name, config, status, registeredAt]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        config:
          $ref: '#/components/schemas/MobileAgentConfig'
        status: { enum: [registered, active, disabled] }
        registeredAt: { type: string, format: date-time }
    MobileAgentConfig:
      type: object
      additionalProperties: false
      required: [name, model, systemPrompt]
      properties:
        name: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        systemPrompt: { type: string }
        fallbackModels:
          type: array
          items: { type: string, minLength: 1 }
        tools:
          type: array
          items: { type: string, minLength: 1 }
        skills:
          type: object
          additionalProperties: false
          properties:
            paths:
              type: array
              items: { type: string, minLength: 1 }
            urls:
              type: array
              items: { type: string, minLength: 1 }
        workspace: { type: string }
        maxTokens: { type: integer, minimum: 1 }
        mcpServers:
          type: array
          items: { type: string, minLength: 1 }
        plugins:
          type: array
          items: { type: string, minLength: 1 }
        providers:
          type: array
          items: { type: string, minLength: 1 }
        swarm:
          type: object
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            maxConcurrentWorkers: { type: integer, minimum: 1 }
            maxWorkersPerRun: { type: integer, minimum: 1 }
            maxSteersPerWorker: { type: integer, minimum: 0 }
            maxRunSeconds: { type: integer, minimum: 1 }
            allowedModels:
              type: array
              items: { type: string, minLength: 1 }
    MobileAgentList:
      type: array
      items:
        $ref: '#/components/schemas/MobileAgent'
    MobileSkill:
      type: object
      additionalProperties: false
      required: [name, description, source]
      properties:
        name: { type: string }
        description: { type: string }
        trigger: { type: string }
        source: { enum: [managed, agent, remote, plugin] }
        content: { type: string }
    MobileSkillList:
      type: array
      items:
        $ref: '#/components/schemas/MobileSkill'
    CreateMobileAgentRequest:
      type: object
      additionalProperties: false
      required: [name, model, systemPrompt]
      properties:
        name: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        systemPrompt: { type: string }
    UpdateMobileAgentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        model: { type: string, minLength: 1 }
        systemPrompt: { type: string }
    MobileActionResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { const: true }
    MemoryInfo:
      type: object
      additionalProperties: false
      required: [name, description, type, source, createdAt, updatedAt, size]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        type: { enum: [user, feedback, project, reference] }
        source: { enum: [agent, sweep, user, import] }
        # Bare calendar days, not RFC 3339 timestamps.
        createdAt: { type: string, format: date }
        updatedAt: { type: string, format: date }
        size: { type: integer, minimum: 0 }
    MemoryInfoList:
      type: array
      items:
        $ref: '#/components/schemas/MemoryInfo'
    MemoryRecord:
      type: object
      additionalProperties: false
      required: [name, description, type, source, createdAt, updatedAt, content]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        type: { enum: [user, feedback, project, reference] }
        source: { enum: [agent, sweep, user, import] }
        createdAt: { type: string, format: date }
        updatedAt: { type: string, format: date }
        content: { type: string }
    MemoryDeleteResponse:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    MemoryNotFoundError:
      description: >-
        The 404 body of the three memory routes, exactly as the gateway emits
        it. Intentionally NOT `MobileApiError`: there is no `code` and no
        `retryable`, so a client that decoded this as the standard envelope
        would fail to parse it.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, minLength: 1 }
    SubagentType:
      type: object
      additionalProperties: false
      required: [name, description, source]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        source: { enum: [builtin, workspace, agent, plugin] }
        location: { type: string, minLength: 1 }
        tools: { type: array, items: { type: string, minLength: 1 } }
        disallowedTools: { type: array, items: { type: string, minLength: 1 } }
        model: { type: string, minLength: 1 }
        skills: { type: array, items: { type: string, minLength: 1 } }
        maxTurns: { type: integer, minimum: 1 }
        background: { type: boolean }
        isolation: { const: worktree }
        shadowedBy:
          type: string
          minLength: 1
          description: >-
            Present ONLY on a definition that LOST a name collision; the value is the
            winner's file path (or its source when it has no file).
    SubagentTypesResponse:
      type: object
      additionalProperties: false
      required: [types, unknownAllowedTypes]
      properties:
        types:
          type: array
          items: { $ref: '#/components/schemas/SubagentType' }
        unknownAllowedTypes:
          type: array
          items: { type: string, minLength: 1 }
          description: >-
            `subagents.allowedTypes` entries matching no resolvable type. Never fatal —
            the remaining entries still apply — but an orchestrator whose whole list is
            listed here can spawn nothing, so clients should surface it.
    SubagentDefinitionsResponse:
      type: object
      additionalProperties: false
      required: [definitions]
      properties:
        definitions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, file]
            properties:
              name: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
              file: { type: string, minLength: 1 }
    SubagentDefinition:
      type: object
      additionalProperties: false
      required: [name, raw]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
        raw: { type: string, minLength: 1 }
    PutSubagentDefinitionRequest:
      type: object
      additionalProperties: false
      required: [raw]
      properties:
        raw:
          type: string
          minLength: 1
          maxLength: 262144
          description: The definition's full markdown, YAML frontmatter included.
    SubagentDefinitionWriteResponse:
      type: object
      additionalProperties: false
      required: [ok, name]
      properties:
        ok: { const: true }
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
    MobileModel:
      type: object
      additionalProperties: false
      required: [value, label, provider]
      properties:
        value:
          type: string
          minLength: 3
          pattern: '^[^/\s]+/[^\s]+$'
        label: { type: string, minLength: 1 }
        provider: { type: string, minLength: 1 }
    MobileModelsResponse:
      type: object
      additionalProperties: false
      required: [models, source, errors, fetchedAt, supportedModelsReviewedAt]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/MobileModel'
        source: { enum: [live, bootstrap] }
        errors:
          type: object
          additionalProperties: { type: string }
        fetchedAt: { type: string, format: date-time }
        supportedModelsReviewedAt:
          anyOf:
            - type: string
              format: date
            - const: unreviewed
    MobileImage:
      type: object
      additionalProperties: false
      required: [mediaType, data]
      properties:
        mediaType: { enum: [image/jpeg, image/png, image/gif, image/webp] }
        data: { type: string, minLength: 1 }
    MobileAgentEvent:
      type: object
      required: [type]
      properties:
        type: { type: string, minLength: 1 }
      additionalProperties: true
    ConversationIdentifier:
      # A user conversation id is a uuid; a sub-agent conversation id is
      # `sub_<ulid>` (design 2026-09-04 sub-agents, 7.4). Both are addressable
      # through the same routes, so every conversation id accepts either shape.
      type: string
      pattern: '^(?:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|sub_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26})$'
    ConversationContent:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, text]
          properties:
            type: { const: user }
            text: { type: string }
            images:
              type: array
              items:
                $ref: '#/components/schemas/MobileImage'
        - type: object
          additionalProperties: false
          required: [type, events]
          properties:
            type: { const: assistant }
            events:
              type: array
              items:
                $ref: '#/components/schemas/MobileAgentEvent'
        - type: object
          additionalProperties: false
          required: [type, kind, text]
          properties:
            type: { const: notice }
            kind: { enum: [skill_learned, memory_saved] }
            text: { type: string }
    SubagentInfo:
      type: object
      additionalProperties: false
      required: [type, status, description, prompt, model, background, depth, startedAt, toolCallCount, oneShot]
      properties:
        type: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        status: { enum: [running, waiting_input, done, failed, cancelled, interrupted, max_turns] }
        description: { type: string }
        prompt: { type: string }
        model: { type: string }
        background: { type: boolean }
        isolation: { const: worktree }
        depth: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        usage:
          type: object
          additionalProperties: false
          required: [inputTokens, outputTokens]
          properties:
            inputTokens: { type: integer, minimum: 0 }
            outputTokens: { type: integer, minimum: 0 }
        toolCallCount: { type: integer, minimum: 0 }
        report: { type: string }
        oneShot: { type: boolean }
        workspace: { type: string, minLength: 1 }
    SubagentListEntry:
      type: object
      additionalProperties: false
      required: [id, type, description, status, background, depth, startedAt, toolCallCount, oneShot]
      properties:
        id: { $ref: '#/components/schemas/ConversationIdentifier' }
        name: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        description: { type: string }
        status: { enum: [running, waiting_input, done, failed, cancelled, interrupted, max_turns] }
        background: { type: boolean }
        depth: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        usage:
          type: object
          additionalProperties: false
          required: [inputTokens, outputTokens]
          properties:
            inputTokens: { type: integer, minimum: 0 }
            outputTokens: { type: integer, minimum: 0 }
        toolCallCount: { type: integer, minimum: 0 }
        report:
          type: string
          description: Scanned sub-agent output; absent until the child reaches a terminal status.
        oneShot:
          type: boolean
          description: Explore / Plan children are not resumable — `POST /subagents/{id}/resume` 409s.
    SubagentListResponse:
      type: object
      additionalProperties: false
      required: [subagents]
      properties:
        subagents:
          type: array
          items: { $ref: '#/components/schemas/SubagentListEntry' }
    SubagentStopResponse:
      type: object
      additionalProperties: false
      required: [ok, status]
      properties:
        ok: { const: true }
        status: { enum: [done, failed, cancelled, interrupted, max_turns] }
    SubagentResumeRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
        requestId:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            Client-chosen correlation id, echoed verbatim on the `accepted` frame of the
            turn this message becomes (`ChatAccepted.requestId`). Optional on purpose:
            an older client omits it and an older gateway never echoes it, so a client
            that sends one and gets none back must fall back to treating the turn as
            uncorrelated rather than guessing. Only a message that STARTS a turn produces
            an echo — an answer to a parked `ask_orchestrator` question resolves inside
            the running turn and never emits one.
    SubagentResumeResponse:
      type: object
      additionalProperties: false
      required: [ok, status, mode]
      properties:
        ok: { type: boolean }
        status: { enum: [spawning, running, waiting_input, done, failed, cancelled, interrupted, max_turns] }
        mode:
          enum: [queued, resumed]
          description: >-
            `queued` — the child was running and takes the message as its next turn.
            `resumed` — the child was finished and a new turn was started on it.
    ConversationSummary:
      type: object
      additionalProperties: false
      required: [id, agentId, agentName, title, revision, status, activeTurnId, owningIssueId, projectId, lastSeq, lastMessagePreview, createdAt, updatedAt, kind]
      properties:
        id: { $ref: '#/components/schemas/ConversationIdentifier' }
        agentId: { type: string, minLength: 1 }
        agentName: { type: string, minLength: 1 }
        title: { type: string }
        revision: { type: integer, minimum: 1 }
        status: { enum: [idle, running, interrupted, archived, deleted] }
        activeTurnId:
          type: [string, 'null']
          format: uuid
        owningIssueId: { type: [string, 'null'] }
        projectId: { type: [string, 'null'] }
        lastSeq: { type: integer, minimum: 0 }
        lastMessagePreview: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time }
        kind: { enum: [user, subagent] }
        parentConversationId: { $ref: '#/components/schemas/ConversationIdentifier' }
        parentTurnId: { type: string, minLength: 1 }
        subagent:
          $ref: '#/components/schemas/SubagentInfo'
    ConversationMessage:
      type: object
      additionalProperties: false
      required: [id, conversationId, turnId, ordinal, role, status, content, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { $ref: '#/components/schemas/ConversationIdentifier' }
        turnId: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        role: { enum: [user, assistant] }
        status: { enum: [accepted, streaming, completed, cancelled, failed, interrupted] }
        content:
          $ref: '#/components/schemas/ConversationContent'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        origin: { enum: [user, notification, parent] }
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummary'
        nextCursor: { type: [string, 'null'] }
    ConversationMessagePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, throughSeq]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        nextCursor: { type: [string, 'null'] }
        throughSeq: { type: integer, minimum: 0 }
    ConversationCreateRequest:
      type: object
      additionalProperties: false
      required: [agentId, requestId]
      properties:
        agentId: { type: string, minLength: 1 }
        requestId: { type: string, minLength: 1 }
        title: { type: string }
        owningIssueId: { type: string, minLength: 1 }
        projectId: { type: string, minLength: 1 }
    ConversationPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string }
        owningIssueId: { type: [string, 'null'] }
        projectId: { type: [string, 'null'] }
    ConversationDefaults:
      description: >-
        Gateway-side defaults that clients must mirror verbatim. `defaultConversationTitle` is
        the title a conversation is created with when the create request omits one; clients
        compare against it to decide whether a conversation is still untitled (auto-title refresh,
        compose-cleanup). Pinned by `const` so the fixture, the gateway, and every client are
        tested against one value.
      type: object
      additionalProperties: false
      required: [defaultConversationTitle]
      properties:
        defaultConversationTitle: { type: string, const: New Conversation }
    MobileApiError:
      type: object
      additionalProperties: false
      required: [code, error, retryable]
      properties:
        code:
          # The last six are `SpeechErrorCode`s. The `/speech/*` handlers reuse this
          # envelope and pass the provider-level code through UNTRANSLATED, so a client
          # that decoded only the first eight would fall off the end of the union on a
          # real transcription failure. `packages/speech/src/errors.ts` owns them.
          enum: [unauthorized, not_found, validation_failed, revision_conflict, conversation_busy, rate_limited, gateway_offline, capability_required, too_large, too_long, provider, network, unavailable, invalid]
        error: { type: string, minLength: 1 }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
    RevisionConflictError:
      allOf:
        - $ref: '#/components/schemas/MobileApiError'
        - type: object
          required: [code, details]
          properties:
            code: { const: revision_conflict }
            details:
              type: object
              additionalProperties: false
              required: [current]
              properties:
                current: { $ref: '#/components/schemas/ConversationSummary' }
    ConversationBusyError:
      allOf:
        - $ref: '#/components/schemas/MobileApiError'
        - type: object
          required: [code, details]
          properties:
            code: { const: conversation_busy }
            details:
              type: object
              additionalProperties: false
              required: [activeTurnId]
              properties:
                activeTurnId: { type: string, minLength: 1 }
    ReplayPayload:
      oneOf:
        # `origin`/`kind` mirror the live `accepted` WebSocket frame
        # (chat-ws.schema.json ChatAccepted). The durable event-log payload does
        # not populate them yet, so a replayed row omits them and absent means
        # unknown, not `user` -- read ConversationMessage.origin and
        # ConversationSummary.kind. They are declared here so the frozen schema
        # accepts them once the log carries them.
        - type: object
          additionalProperties: false
          required: [type, userMessageId, assistantMessageId, revision]
          properties:
            type: { const: accepted }
            userMessageId: { type: string, format: uuid }
            assistantMessageId: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            origin: { enum: [user, notification, parent] }
            kind: { enum: [user, subagent] }
        - type: object
          additionalProperties: false
          required: [type, event]
          properties:
            type: { const: event }
            event:
              $ref: '#/components/schemas/MobileAgentEvent'
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { const: done }
            outcome: { enum: [completed, cancelled] }
        - type: object
          additionalProperties: false
          required: [type, error]
          properties:
            type: { const: error }
            error: { type: string, minLength: 1 }
            code:
              enum: [unauthorized, not_found, validation_failed, revision_conflict, conversation_busy, rate_limited, gateway_offline, capability_required, too_large, too_long, provider, network, unavailable, invalid]
            retryable: { type: boolean }
    ReplayEntry:
      type: object
      additionalProperties: false
      required: [seq, msgId, agentId, conversationId, timestamp, payload]
      properties:
        seq: { type: integer, minimum: 1 }
        msgId: { type: string, minLength: 1 }
        agentId: { type: string, minLength: 1 }
        conversationId: { $ref: '#/components/schemas/ConversationIdentifier' }
        timestamp: { type: string, format: date-time }
        payload:
          $ref: '#/components/schemas/ReplayPayload'
    ReplayPage:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ReplayEntry'
    ConversationChangedEvent:
      type: object
      additionalProperties: false
      required: [type, conversationId, revision]
      properties:
        type: { const: 'conversation:changed' }
        conversationId: { $ref: '#/components/schemas/ConversationIdentifier' }
        revision: { type: integer, minimum: 1 }
    ConversationDeletedEvent:
      type: object
      additionalProperties: false
      required: [type, conversationId, revision]
      properties:
        type: { const: 'conversation:deleted' }
        conversationId: { $ref: '#/components/schemas/ConversationIdentifier' }
        revision: { type: integer, minimum: 1 }
    WsTicketResponse:
      type: object
      required: [ticket, expiresAt]
      additionalProperties: false
      properties:
        ticket:
          type: string
          minLength: 32
        expiresAt:
          type: string
          format: date-time
    SpeechConfig:
      description: >-
        The gateway's persisted speech configuration (`packages/speech/src/config.ts`).
        `realtime.provider` is explicitly nullable and null means "no realtime provider";
        omission is NOT the same thing on a patch.
      type: object
      additionalProperties: false
      required: [stt, tts, realtime]
      properties:
        stt:
          type: object
          additionalProperties: false
          required: [provider, model]
          properties:
            provider: { type: string, minLength: 1, maxLength: 200 }
            model: { type: string, minLength: 1, maxLength: 200 }
            language: { type: string, minLength: 2, maxLength: 8 }
        tts:
          type: object
          additionalProperties: false
          required: [provider, model, voice]
          properties:
            provider: { type: string, minLength: 1, maxLength: 200 }
            model: { type: string, minLength: 1, maxLength: 200 }
            voice: { type: string, minLength: 1, maxLength: 200 }
            speed: { type: number, minimum: 0.25, maximum: 4 }
        realtime:
          type: object
          additionalProperties: false
          required: [provider]
          properties:
            provider: { type: [string, 'null'], minLength: 1, maxLength: 200 }
    SpeechCapabilities:
      type: object
      additionalProperties: false
      required: [transcription, speech, realtime]
      properties:
        transcription: { type: boolean }
        speech: { type: boolean }
        realtime: { type: boolean }
    SpeechProviderStatus:
      description: >-
        One row per provider the gateway knows how to build, plus the `realtime`
        pseudo-entry which is always unavailable until a provider offers realtime.
        `reason` is present only when `available` is false.
      type: object
      additionalProperties: false
      required: [id, capabilities, available]
      properties:
        id: { type: string, minLength: 1 }
        capabilities: { $ref: '#/components/schemas/SpeechCapabilities' }
        available: { type: boolean }
        reason: { enum: [no_credential, no_provider_offers_realtime] }
    SpeechConfigResponse:
      type: object
      additionalProperties: false
      required: [config, providers]
      properties:
        config: { $ref: '#/components/schemas/SpeechConfig' }
        providers:
          type: array
          items: { $ref: '#/components/schemas/SpeechProviderStatus' }
    SpeechConfigPatch:
      description: >-
        Every member is optional, but `realtime` is all-or-nothing: when the object is
        present its `provider` key is REQUIRED and may be null. A client that omits the
        key inside a present `realtime` gets a 400, so encoders must write an explicit
        JSON null rather than dropping the field. `stt.language` is nullable for a
        different reason: omitting it leaves the language alone, and `null` clears it
        back to the provider's own detection.
      type: object
      additionalProperties: false
      properties:
        stt:
          type: object
          additionalProperties: false
          properties:
            provider: { type: string, minLength: 1, maxLength: 200 }
            model: { type: string, minLength: 1, maxLength: 200 }
            # Explicitly nullable, like `realtime.provider`: an OMITTED key
            # leaves the language alone, while `null` CLEARS it back to the
            # provider's own detection. `SpeechConfig.stt.language` is absent
            # when auto, so there is no other way to express it.
            language: { type: [string, 'null'], minLength: 2, maxLength: 8 }
        tts:
          type: object
          additionalProperties: false
          properties:
            provider: { type: string, minLength: 1, maxLength: 200 }
            model: { type: string, minLength: 1, maxLength: 200 }
            voice: { type: string, minLength: 1, maxLength: 200 }
            speed: { type: number, minimum: 0.25, maximum: 4 }
        realtime:
          type: object
          additionalProperties: false
          required: [provider]
          properties:
            provider: { type: [string, 'null'], minLength: 1, maxLength: 200 }
    SpeechModel:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        kind: { enum: [transcription, speech] }
        voices:
          description: Present only on `speech` models that expose named voices.
          type: array
          items: { type: string, minLength: 1 }
    SpeechModelList:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: '#/components/schemas/SpeechModel' }
    TranscriptionRequest:
      type: object
      additionalProperties: false
      required: [audio, format]
      properties:
        audio:
          description: >-
            Standard base64 (no URL alphabet, no newlines). The gateway rejects anything
            whose length is not a multiple of 4 or that carries a character outside
            `A-Za-z0-9+/=`, and rejects an empty decode.
          type: string
          minLength: 4
          contentEncoding: base64
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
        format: { enum: [wav, m4a, mp3, flac, ogg, webm, aac] }
        language:
          description: BCP-47 / ISO-639 hint passed to the provider.
          type: string
          minLength: 2
          maxLength: 8
    TranscriptionResponse:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string }
        durationSeconds:
          description: Present only when the provider reported one.
          type: number
          minimum: 0
    SynthesisRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          description: >-
            Bounded by the upstream TTS limit — `MAX_TTS_CHARS` in the gateway's speech
            routes and `MAX_SYNTHESIZE_CHARS` in `@dash/speech`. Over it, 413 `too_long`.
          type: string
          minLength: 1
          maxLength: 4000

openapi: 3.1.0
info:
  title: Dash Mobile Conversation Sync API
  version: 2.0.0
  description: Parallel version 2 wire contract for resumable runs and durable queued input.
servers:
  - url: /mobile/v2
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getMobileHealth
      security: []
      responses:
        '200':
          description: Gateway health and mobile capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileV2HealthResponse'
  /identity:
    get:
      operationId: getGatewayIdentity
      responses:
        '200':
          description: Stable gateway relay identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /agents:
    get:
      operationId: listMobileAgents
      responses:
        '200':
          description: Secret-stripped registered agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAgentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createMobileAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMobileAgentRequest'
      responses:
        '201':
          description: Created agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAgent'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: getMobileAgent
      responses:
        '200':
          description: Secret-stripped registered agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAgent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateMobileAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMobileAgentRequest'
      responses:
        '200':
          description: Updated agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAgent'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMobileAgent
      responses:
        '200':
          description: Agent deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      operationId: enableMobileAgent
      responses:
        '200':
          description: Agent enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      operationId: disableMobileAgent
      responses:
        '200':
          description: Agent disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  # The three memory operations answer 404 with `MemoryNotFound`, NOT the
  # `NotFound` (`MobileApiError`) envelope every other operation in this
  # namespace uses. That is deliberate: the gateway handlers emit the bare
  # `{ "error": "not found" }` body, and this document describes what is
  # actually on the wire. See the `MemoryNotFound` response for the full note.
  /agents/{id}/memory:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: listMobileAgentMemories
      responses:
        '200':
          description: Memories the agent has saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryInfoList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
  /agents/{id}/memory/{name}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/MemoryName'
    get:
      operationId: getMobileAgentMemory
      responses:
        '200':
          description: The full memory record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
    delete:
      operationId: deleteMobileAgentMemory
      responses:
        '200':
          description: The deleted memory's name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
  /models:
    get:
      operationId: listMobileModels
      responses:
        '200':
          description: Models available to mobile agent configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileModelsResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /conversations:
    get:
      operationId: listConversations
      parameters:
        - $ref: '#/components/parameters/ConversationAgentId'
        - $ref: '#/components/parameters/ConversationLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of conversation summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileV2ConversationPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreateRequest'
      responses:
        '201':
          description: Created conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileV2ConversationSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: getConversation
      responses:
        '200':
          description: Current conversation summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileV2ConversationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchConversation
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationPatchRequest'
      responses:
        '200':
          description: Updated conversation summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileV2ConversationSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Revision conflict or archived conversation.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RevisionConflictError'
                  - $ref: '#/components/schemas/ConversationArchivedError'
        '410':
          $ref: '#/components/responses/Gone'
    delete:
      operationId: deleteConversation
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Revisioned conversation tombstone after content deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileV2ConversationSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conversation has an active turn or the revision is stale.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RevisionConflictError'
                  - $ref: '#/components/schemas/ConversationBusyError'
                  - $ref: '#/components/schemas/ConversationArchivedError'
        '410':
          $ref: '#/components/responses/Gone'
  /conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listConversationMessages
      parameters:
        - $ref: '#/components/parameters/MessageLimit'
        - $ref: '#/components/parameters/BeforeCursor'
      responses:
        '200':
          description: A stable page of persisted messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileV2ConversationMessagePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{id}/bootstrap:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: getConversationBootstrap
      parameters:
        - $ref: '#/components/parameters/MessageLimit'
        - $ref: '#/components/parameters/BeforeCursor'
      responses:
        '200':
          description: Transactional conversation, message, and pending-input snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileV2ConversationBootstrap'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{agentId}/conversations/{conversationId}/events:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - name: conversationId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/CanonicalUuid' }
    get:
      operationId: replayConversationEvents
      parameters:
        - $ref: '#/components/parameters/SinceV2Seq'
      responses:
        '200':
          description: Sequenced v2 frames strictly after sinceV2Seq.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileV2ReplayPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /events:
    get:
      operationId: streamConversationChanges
      responses:
        '200':
          description: Server-sent conversation cache invalidation events.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ConversationChangedEvent'
                  - $ref: '#/components/schemas/ConversationDeletedEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /ws-ticket:
    post:
      operationId: createWsTicket
      summary: Mint a single-use, short-lived WebSocket upgrade ticket.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ticket created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AgentId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    MemoryName:
      name: name
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ConversationId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CanonicalUuid' }
    ConversationAgentId:
      name: agentId
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    ConversationLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    MessageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    BeforeCursor:
      name: before
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    SinceV2Seq:
      name: sinceV2Seq
      in: query
      required: true
      schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { $ref: '#/components/schemas/QuotedSafeInteger' }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MobileApiError'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MobileApiError'
    MemoryNotFound:
      description: >-
        The agent, or the named memory, does not exist. DELIBERATE DIVERGENCE:
        the memory routes reply with the gateway's bare `{ "error": ... }` body
        instead of the `MobileApiError` envelope the rest of this namespace
        uses, so they are documented with their own schema rather than
        `NotFound`. Clients must not expect `code`/`retryable` here; iOS maps
        the 404 status before it reads the body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryNotFoundError'
    Gone:
      description: The conversation was previously deleted and cannot be mutated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MobileApiError'
    ValidationFailed:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MobileApiError'
  schemas:
    QuotedSafeInteger:
      type: string
      pattern: '^"(?:0|[1-9][0-9]{0,14}|[1-8][0-9]{15}|900[0-6][0-9]{12}|90070[0-9]{11}|90071[0-8][0-9]{10}|900719[0-8][0-9]{9}|9007199[01][0-9]{8}|90071992[0-4][0-9]{7}|900719925[0-3][0-9]{6}|9007199254[0-6][0-9]{5}|90071992547[0-3][0-9]{4}|9007199254740[0-8][0-9]{2}|90071992547409[0-8][0-9]|900719925474099[01])"$'
    CanonicalUuid:
      type: string
      format: uuid
      pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
    LegacyRunId:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '[^ \t\r\n]'
      x-maxUtf8Bytes: 256
    MobileV2HealthResponse:
      type: object
      additionalProperties: false
      required: [status, startedAt, pid, agents, channels, apiVersion, capabilities]
      properties:
        status: { const: healthy }
        startedAt: { type: string, format: date-time }
        pid: { type: integer, minimum: 1 }
        agents: { type: integer, minimum: 0 }
        channels: { type: integer, minimum: 0 }
        apiVersion: { const: 2 }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
    GatewayIdentity:
      type: object
      additionalProperties: false
      required: [gatewayId, publicKey]
      properties:
        gatewayId: { type: string, minLength: 1 }
        publicKey: { type: string, minLength: 1 }
    PairingPayload:
      oneOf:
        - type: object
          additionalProperties: true
          $comment: Clients trim mgmtToken and chatToken before requiring equality and storing one phone-scoped capability.
          required: [v, host, secure, mgmtToken, chatToken, relayCredential]
          properties:
            v: { const: 2 }
            host:
              type: string
              minLength: 1
              pattern: '^(?![A-Za-z][A-Za-z0-9+.-]*:)[^\s/\\?#@%]+$'
            secure: { const: true }
            mgmtToken: { type: string, minLength: 1, pattern: '.*\S.*' }
            chatToken: { type: string, minLength: 1, pattern: '.*\S.*' }
            relayCredential: { type: string, minLength: 1, pattern: '.*\S.*' }
        - type: object
          additionalProperties: true
          $comment: Clients trim mgmtToken and chatToken before requiring equality; mgmtPort and chatPort are equal.
          required:
            [
              v,
              host,
              secure,
              mgmtToken,
              chatToken,
              mgmtPort,
              chatPort,
              tlsCertificateSha256,
            ]
          properties:
            v: { const: 3 }
            host:
              type: string
              minLength: 1
              pattern: '^(?![A-Za-z][A-Za-z0-9+.-]*:)[^\s/\\?#@%]+$'
            secure: { const: true }
            mgmtToken: { type: string, minLength: 1, pattern: '.*\S.*' }
            chatToken: { type: string, minLength: 1, pattern: '.*\S.*' }
            mgmtPort: { type: integer, minimum: 1, maximum: 65535 }
            chatPort: { type: integer, minimum: 1, maximum: 65535 }
            tlsCertificateSha256:
              type: string
              pattern: '^[A-Fa-f0-9]{64}$'
    MobileAgent:
      type: object
      additionalProperties: false
      required: [id, name, config, status, registeredAt]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        config:
          $ref: '#/components/schemas/MobileAgentConfig'
        status: { enum: [registered, active, disabled] }
        registeredAt: { type: string, format: date-time }
    MobileAgentConfig:
      type: object
      additionalProperties: false
      required: [name, model, systemPrompt]
      properties:
        name: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        systemPrompt: { type: string }
        fallbackModels:
          type: array
          items: { type: string, minLength: 1 }
        tools:
          type: array
          items: { type: string, minLength: 1 }
        skills:
          type: object
          additionalProperties: false
          properties:
            paths:
              type: array
              items: { type: string, minLength: 1 }
            urls:
              type: array
              items: { type: string, minLength: 1 }
        workspace: { type: string }
        maxTokens: { type: integer, minimum: 1 }
        mcpServers:
          type: array
          items: { type: string, minLength: 1 }
        plugins:
          type: array
          items: { type: string, minLength: 1 }
        providers:
          type: array
          items: { type: string, minLength: 1 }
        swarm:
          type: object
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            maxConcurrentWorkers: { type: integer, minimum: 1 }
            maxWorkersPerRun: { type: integer, minimum: 1 }
            maxSteersPerWorker: { type: integer, minimum: 0 }
            maxRunSeconds: { type: integer, minimum: 1 }
            allowedModels:
              type: array
              items: { type: string, minLength: 1 }
    MobileAgentList:
      type: array
      items:
        $ref: '#/components/schemas/MobileAgent'
    CreateMobileAgentRequest:
      type: object
      additionalProperties: false
      required: [name, model, systemPrompt]
      properties:
        name: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        systemPrompt: { type: string }
    UpdateMobileAgentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        model: { type: string, minLength: 1 }
        systemPrompt: { type: string }
    MobileActionResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { const: true }
    MemoryInfo:
      type: object
      additionalProperties: false
      required: [name, description, type, source, createdAt, updatedAt, size]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        type: { enum: [user, feedback, project, reference] }
        source: { enum: [agent, sweep, user, import] }
        # Bare calendar days, not RFC 3339 timestamps.
        createdAt: { type: string, format: date }
        updatedAt: { type: string, format: date }
        size: { type: integer, minimum: 0 }
    MemoryInfoList:
      type: array
      items:
        $ref: '#/components/schemas/MemoryInfo'
    MemoryRecord:
      type: object
      additionalProperties: false
      required: [name, description, type, source, createdAt, updatedAt, content]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        type: { enum: [user, feedback, project, reference] }
        source: { enum: [agent, sweep, user, import] }
        createdAt: { type: string, format: date }
        updatedAt: { type: string, format: date }
        content: { type: string }
    MemoryDeleteResponse:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    MemoryNotFoundError:
      description: >-
        The 404 body of the three memory routes, exactly as the gateway emits
        it. Intentionally NOT `MobileApiError`: there is no `code` and no
        `retryable`, so a client that decoded this as the standard envelope
        would fail to parse it.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, minLength: 1 }
    MobileModel:
      type: object
      additionalProperties: false
      required: [value, label, provider]
      properties:
        value:
          type: string
          minLength: 3
          pattern: '^[^/\s]+/[^\s]+$'
        label: { type: string, minLength: 1 }
        provider: { type: string, minLength: 1 }
    MobileModelsResponse:
      type: object
      additionalProperties: false
      required: [models, source, errors, fetchedAt, supportedModelsReviewedAt]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/MobileModel'
        source: { enum: [live, bootstrap] }
        errors:
          type: object
          additionalProperties: { type: string }
        fetchedAt: { type: string, format: date-time }
        supportedModelsReviewedAt:
          anyOf:
            - type: string
              format: date
            - const: unreviewed
    MobileImage:
      type: object
      additionalProperties: false
      required: [mediaType, data]
      properties:
        mediaType: { enum: [image/jpeg, image/png, image/gif, image/webp] }
        data: { type: string, minLength: 1 }
    MobileAgentEvent:
      type: object
      required: [type]
      properties:
        type: { type: string, minLength: 1 }
      additionalProperties: true
    ConversationContent:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, text]
          properties:
            type: { const: user }
            text: { type: string }
            images:
              type: array
              maxItems: 4
              items:
                $ref: '#/components/schemas/MobileImage'
        - type: object
          additionalProperties: false
          required: [type, events]
          properties:
            type: { const: assistant }
            events:
              type: array
              items:
                $ref: '#/components/schemas/MobileAgentEvent'
    MobileV2ConversationSummary:
      type: object
      additionalProperties: false
      required: [id, agentId, agentName, title, revision, status, activeTurnId, owningIssueId, projectId, lastSeq, lastMessagePreview, createdAt, updatedAt, queuePaused, queueRevision, pendingFollowUpCount, v2LastSeq]
      properties:
        id: { $ref: '#/components/schemas/CanonicalUuid' }
        agentId: { type: string, minLength: 1 }
        agentName: { type: string, minLength: 1 }
        title: { type: string }
        revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        status: { enum: [idle, running, interrupted, archived, deleted] }
        activeTurnId:
          oneOf:
            - $ref: '#/components/schemas/LegacyRunId'
            - type: 'null'
        owningIssueId: { type: [string, 'null'] }
        projectId: { type: [string, 'null'] }
        lastSeq: { type: integer, minimum: 0, maximum: 9007199254740991 }
        lastMessagePreview: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time }
        queuePaused: { type: boolean }
        queueRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        pendingFollowUpCount: { type: integer, minimum: 0, maximum: 9007199254740991 }

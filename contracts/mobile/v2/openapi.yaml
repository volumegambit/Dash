        inputId: { $ref: '#/components/schemas/CanonicalUuid' }
        kind: { enum: [steer, follow_up] }
        targetTurnId: { $ref: '#/components/schemas/LegacyRunId' }
        text: { type: string }
        images:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/MobileImage'
        state: { enum: [queued, delivering, delivered, removed, failed] }
        revision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        enqueueOrder: { type: integer, minimum: 0, maximum: 9007199254740991 }
        runId: { $ref: '#/components/schemas/LegacyRunId' }
        segmentTurnId: { $ref: '#/components/schemas/CanonicalUuid' }
        userMessageId: { $ref: '#/components/schemas/CanonicalUuid' }
        assistantMessageId: { $ref: '#/components/schemas/CanonicalUuid' }
        failureCode:
          $ref: '#/components/schemas/MobileApiErrorCode'
        failureMessage: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time }
    MobileV2ConversationBootstrap:
      type: object
      additionalProperties: false
      required: [conversation, messages, nextCursor, pendingInputs, queuePaused, queueRevision, v2ThroughSeq]
      properties:
        conversation:
          $ref: '#/components/schemas/MobileV2ConversationSummary'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MobileV2ConversationMessage'
        nextCursor: { type: [string, 'null'] }
        pendingInputs:
          type: array
          items:
            $ref: '#/components/schemas/MobileV2PendingInput'
        queuePaused: { type: boolean }
        queueRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        v2ThroughSeq: { type: integer, minimum: 0, maximum: 9007199254740991 }
    ChatAccepted:
      type: object
      additionalProperties: false
      required: [type, id, conversationId, runId, segmentTurnId, v2Seq, userMessageId, assistantMessageId, revision]
      properties:
        type: { const: accepted }
        id: { $ref: '#/components/schemas/LegacyRunId' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        runId: { $ref: '#/components/schemas/LegacyRunId' }
        segmentTurnId: { $ref: '#/components/schemas/LegacyRunId' }
        v2Seq: { type: integer, minimum: 0, maximum: 9007199254740991 }
        userMessageId: { $ref: '#/components/schemas/CanonicalUuid' }
        assistantMessageId: { $ref: '#/components/schemas/CanonicalUuid' }
        revision: { type: integer, minimum: 0, maximum: 9007199254740991 }
    ChatEvent:
      type: object
      additionalProperties: false
      required: [type, id, conversationId, runId, segmentTurnId, v2Seq, event]
      properties:
        type: { const: event }
        id: { $ref: '#/components/schemas/LegacyRunId' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        runId: { $ref: '#/components/schemas/LegacyRunId' }
        segmentTurnId: { $ref: '#/components/schemas/LegacyRunId' }
        v2Seq: { type: integer, minimum: 0, maximum: 9007199254740991 }
        event: { $ref: '#/components/schemas/MobileAgentEvent' }
    ChatDone:
      type: object
      additionalProperties: false
      required: [type, id, conversationId, runId, segmentTurnId, v2Seq, outcome]
      properties:
        type: { const: done }
        id: { $ref: '#/components/schemas/LegacyRunId' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        runId: { $ref: '#/components/schemas/LegacyRunId' }
        segmentTurnId: { $ref: '#/components/schemas/LegacyRunId' }
        v2Seq: { type: integer, minimum: 0, maximum: 9007199254740991 }
        outcome: { enum: [completed, cancelled, interrupted] }
    ChatError:
      type: object
      additionalProperties: false
      required: [type, id, conversationId, runId, segmentTurnId, v2Seq, error]
      properties:
        type: { const: error }
        id: { $ref: '#/components/schemas/LegacyRunId' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        runId: { $ref: '#/components/schemas/LegacyRunId' }
        segmentTurnId: { $ref: '#/components/schemas/LegacyRunId' }
        v2Seq: { type: integer, minimum: 0, maximum: 9007199254740991 }
        error: { type: string, minLength: 1 }
        code: { $ref: '#/components/schemas/MobileApiErrorCode' }
        retryable: { type: boolean }
    InputAccepted:
      type: object
      additionalProperties: false
      required: [type, id, conversationId, v2Seq, queueRevision, input]
      properties:
        type: { const: input_accepted }
        id: { $ref: '#/components/schemas/CanonicalUuid' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        v2Seq: { type: integer, minimum: 0, maximum: 9007199254740991 }
        queueRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        input: { $ref: '#/components/schemas/MobileV2PendingInput' }
    InputUpdated:
      type: object
      additionalProperties: false
      required: [type, id, conversationId, v2Seq, queueRevision, input]
      properties:
        type: { const: input_updated }
        id: { $ref: '#/components/schemas/CanonicalUuid' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        v2Seq: { type: integer, minimum: 0, maximum: 9007199254740991 }
        queueRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        input: { $ref: '#/components/schemas/MobileV2PendingInput' }
    InputRemoved:
      type: object
      additionalProperties: false
      required: [type, id, conversationId, v2Seq, queueRevision, input]
      properties:
        type: { const: input_removed }
        id: { $ref: '#/components/schemas/CanonicalUuid' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        v2Seq: { type: integer, minimum: 0, maximum: 9007199254740991 }
        queueRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        input: { $ref: '#/components/schemas/MobileV2PendingInput' }
    InputDelivered:
      type: object
      additionalProperties: false
      required: [type, id, conversationId, v2Seq, queueRevision, input, runId, segmentTurnId, userMessageId, assistantMessageId]
      properties:
        type: { const: input_delivered }
        id: { $ref: '#/components/schemas/CanonicalUuid' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        v2Seq: { type: integer, minimum: 0, maximum: 9007199254740991 }
        queueRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        input: { $ref: '#/components/schemas/MobileV2PendingInput' }
        runId: { $ref: '#/components/schemas/LegacyRunId' }
        segmentTurnId: { $ref: '#/components/schemas/CanonicalUuid' }
        userMessageId: { $ref: '#/components/schemas/CanonicalUuid' }
        assistantMessageId: { $ref: '#/components/schemas/CanonicalUuid' }
    InputFailed:
      type: object
      additionalProperties: false
      required: [type, id, conversationId, v2Seq, queueRevision, input]
      properties:
        type: { const: input_failed }
        id: { $ref: '#/components/schemas/CanonicalUuid' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        v2Seq: { type: integer, minimum: 0, maximum: 9007199254740991 }
        queueRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        input: { $ref: '#/components/schemas/MobileV2PendingInput' }
    QueuePaused:
      type: object
      additionalProperties: false
      required: [type, conversationId, v2Seq, queueRevision, queuePaused, pendingFollowUpCount]
      properties:
        type: { const: queue_paused }
        id: { $ref: '#/components/schemas/CanonicalUuid' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        v2Seq: { type: integer, minimum: 0, maximum: 9007199254740991 }
        queueRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        queuePaused: { type: boolean }
        pendingFollowUpCount: { type: integer, minimum: 0, maximum: 9007199254740991 }
    QueueResumed:
      type: object
      additionalProperties: false
      required: [type, conversationId, v2Seq, queueRevision, queuePaused, pendingFollowUpCount]
      properties:
        type: { const: queue_resumed }
        id: { $ref: '#/components/schemas/CanonicalUuid' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        v2Seq: { type: integer, minimum: 0, maximum: 9007199254740991 }
        queueRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        queuePaused: { type: boolean }
        pendingFollowUpCount: { type: integer, minimum: 0, maximum: 9007199254740991 }
    MobileV2SequencedFrame:
      oneOf:
        - $ref: '#/components/schemas/ChatAccepted'
        - $ref: '#/components/schemas/ChatEvent'
        - $ref: '#/components/schemas/ChatDone'
        - $ref: '#/components/schemas/ChatError'
        - $ref: '#/components/schemas/InputAccepted'
        - $ref: '#/components/schemas/InputUpdated'
        - $ref: '#/components/schemas/InputRemoved'
        - $ref: '#/components/schemas/InputDelivered'
        - $ref: '#/components/schemas/InputFailed'
        - $ref: '#/components/schemas/QueuePaused'
        - $ref: '#/components/schemas/QueueResumed'
    MobileV2ReplayPage:
      type: object
      additionalProperties: false
      required: [frames, v2ThroughSeq]
      properties:
        frames:
          type: array
          items: { $ref: '#/components/schemas/MobileV2SequencedFrame' }
        v2ThroughSeq: { type: integer, minimum: 0, maximum: 9007199254740991 }
    ConversationCreateRequest:
      type: object
      additionalProperties: false
      required: [agentId, requestId]
      properties:
        agentId: { type: string, minLength: 1 }
        requestId: { type: string, minLength: 1 }
        title: { type: string }
        owningIssueId: { type: string, minLength: 1 }
        projectId: { type: string, minLength: 1 }
    ConversationPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string }
        owningIssueId: { type: [string, 'null'] }
        projectId: { type: [string, 'null'] }
    ConversationDefaults:
      description: >-
        Gateway-side defaults that clients must mirror verbatim. `defaultConversationTitle` is
        the title a conversation is created with when the create request omits one; clients
        compare against it to decide whether a conversation is still untitled (auto-title refresh,
        compose-cleanup). Pinned by `const` so the fixture, the gateway, and every client are
        tested against one value.
      type: object
      additionalProperties: false
      required: [defaultConversationTitle]
      properties:
        defaultConversationTitle: { type: string, const: New Conversation }
    MobileApiErrorCode:
      enum:
        - unauthorized
        - not_found
        - validation_failed
        - revision_conflict
        - conversation_busy
        - rate_limited
        - gateway_offline
        - capability_required
    MobileApiError:
      type: object
      additionalProperties: false
      required: [code, error, retryable]
      properties:
        code:
          enum: [unauthorized, not_found, validation_failed, revision_conflict, conversation_busy, rate_limited, gateway_offline, capability_required]
        error: { type: string, minLength: 1 }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
    RevisionConflictError:
      allOf:
        - $ref: '#/components/schemas/MobileApiError'
        - type: object
          required: [code, details]
          properties:
            code: { const: revision_conflict }
            details:
              type: object
              additionalProperties: false
              required: [current]
              properties:
                current: { $ref: '#/components/schemas/MobileV2ConversationSummary' }
    ConversationBusyError:
      allOf:
        - $ref: '#/components/schemas/MobileApiError'
        - type: object
          required: [code, details]
          properties:
            code: { const: conversation_busy }
            details:
              type: object
              additionalProperties: false
              required: [activeTurnId]
              properties:
                activeTurnId: { $ref: '#/components/schemas/LegacyRunId' }
    ConversationArchivedError:
      allOf:
        - $ref: '#/components/schemas/MobileApiError'
        - type: object
          required: [code]
          properties:
            code: { const: validation_failed }
    ReplayPayload:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, userMessageId, assistantMessageId, revision]
          properties:
            type: { const: accepted }
            userMessageId: { $ref: '#/components/schemas/CanonicalUuid' }
            assistantMessageId: { $ref: '#/components/schemas/CanonicalUuid' }
            revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        - type: object
          additionalProperties: false
          required: [type, event]
          properties:
            type: { const: event }
            event:
              $ref: '#/components/schemas/MobileAgentEvent'
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { const: done }
            outcome: { enum: [completed, cancelled] }
        - type: object
          additionalProperties: false
          required: [type, error]
          properties:
            type: { const: error }
            error: { type: string, minLength: 1 }
            code:
              enum: [unauthorized, not_found, validation_failed, revision_conflict, conversation_busy, rate_limited, gateway_offline, capability_required]
            retryable: { type: boolean }
    ReplayEntry:
      type: object
      additionalProperties: false
      required: [seq, msgId, agentId, conversationId, timestamp, payload]
      properties:
        seq: { type: integer, minimum: 1, maximum: 9007199254740991 }
        msgId: { type: string, minLength: 1 }
        agentId: { type: string, minLength: 1 }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        timestamp: { type: string, format: date-time }
        payload:
          $ref: '#/components/schemas/ReplayPayload'
    ReplayPage:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ReplayEntry'
    ConversationChangedEvent:
      type: object
      additionalProperties: false
      required: [type, conversationId, revision]
      properties:
        type: { const: 'conversation:changed' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
    ConversationDeletedEvent:
      type: object
      additionalProperties: false
      required: [type, conversationId, revision]
      properties:
        type: { const: 'conversation:deleted' }
        conversationId: { $ref: '#/components/schemas/CanonicalUuid' }
        revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
    WsTicketResponse:
      type: object
      required: [ticket, expiresAt]
      additionalProperties: false
      properties:
        ticket:
          type: string
          minLength: 32
        expiresAt:
          type: string
          format: date-time

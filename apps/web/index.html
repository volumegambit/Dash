<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Vite substitutes the VITE_ placeholders below from the build-time env
      (the same values `src/config.ts` reads), so the network allowlist is
      pinned to THIS deployment's control plane and relay domain rather than a
      blanket `https:`. Serve the same policy as a real header in production —
      see README.md ("Deploy: its own origin"), which mirrors this verbatim.

      A missing var is left as an un-substituted literal, which browsers drop
      as an invalid source expression — i.e. it fails closed, blocking the app
      rather than silently widening the policy. Build with all three set; Vite
      also warns at build time when one is absent.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' %VITE_CONTROL_PLANE_URL% https://*.%VITE_RELAY_DOMAIN% wss://*.%VITE_RELAY_DOMAIN% https://*.clerk.accounts.dev https://*.clerk.com; script-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://img.clerk.com data:; font-src 'self' data:; frame-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <title>Dash</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

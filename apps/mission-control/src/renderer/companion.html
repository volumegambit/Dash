<!doctype html>
<html lang="en" class="dark">

    <meta charset="UTF-8" />
    <title>Companion</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }

    <script type="module" src="./src/companion-entry.tsx"></script>

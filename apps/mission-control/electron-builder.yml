appId: ai.dashsquad.mission-control
productName: Dash
copyright: Copyright © 2026 Dash AI Labs Pte. Ltd.

directories:
  buildResources: build
  output: release
  app: release/staging/app

npmRebuild: false

files:
  - out/**/*

extraResources:
  - from: release/staging/runtime
    to: .
    filter:
      - "**/*"

mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlementsInherit: build/entitlements.mac.plist
  entitlements: build/entitlements.mac.plist

dmg:
  sign: false

win:
  target: nsis

linux:
  target: AppImage

publish:
  provider: github
  owner: volumegambit
  repo: Dash

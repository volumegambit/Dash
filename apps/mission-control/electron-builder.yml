appId: ai.dashsquad.mission-control
productName: Dash
copyright: Copyright © 2026 Dash AI Labs Pte. Ltd.

directories:
  buildResources: build
  output: release
  app: release/staging/app

npmRebuild: false

# Do not run `npm install --production` inside the workspace before packaging:
# in an npm workspace it prunes the ROOT node_modules (including
# app-builder-bin, electron-builder's own helper) and the build dies with
# ENOENT. Runtime dependencies are copied explicitly via extraResources below.
npmRebuild: false

files:
  - out/**/*

extraResources:
  - from: release/staging/runtime
    to: .
    filter:
      - "**/*"

mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlementsInherit: build/entitlements.mac.plist
  entitlements: build/entitlements.mac.plist

dmg:
  sign: false

win:
  target: nsis

linux:
  target: AppImage

publish:
  provider: github
  owner: volumegambit
  repo: Dash

name = "atrium-waitlist"
main = "src/worker.ts"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "atrium-waitlist"
database_id = "38a504a5-4c7c-4128-bc67-c626a15ab64a"

# Staging worker — deployed by .github/workflows/deploy-staging.yml with
# `wrangler deploy --env staging`. Create its D1 database once
# (`wrangler d1 create atrium-waitlist-staging`) and paste the id below.
[env.staging]
name = "atrium-waitlist-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "atrium-waitlist-staging"
database_id = "00000000-0000-0000-0000-000000000000"

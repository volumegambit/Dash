name: Dash
options:
  minimumXcodeGenVersion: 2.45.4
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  Dash:
    type: application
    platform: iOS
    sources:
      - path: Dash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dash.ios
        PRODUCT_NAME: Dash
        INFOPLIST_FILE: Dash/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  DashTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DashTests
      - path: DashContractTests
        includes:
          - FixtureLoader.swift
        optional: true
      - path: ../contracts/mobile/v1/fixtures
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: Dash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dash.ios.tests
  DashContractTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DashContractTests
        optional: true
      - path: ../contracts/mobile/v1/fixtures
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: Dash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dash.ios.contract-tests
  DashIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DashIntegrationTests
        optional: true
    dependencies:
      - target: Dash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dash.ios.integration-tests
  DashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DashUITests
        optional: true
    dependencies:
      - target: Dash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dash.ios.ui-tests
schemes:
  Dash:
    build:
      targets:
        Dash: all
        DashTests: [test]
        DashContractTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - DashTests
        - DashContractTests
  DashIntegration:
    build:
      targets:
        Dash: all
        DashIntegrationTests: [test]
    test:
      targets:
        - DashIntegrationTests
  DashUI:
    build:
      targets:
        Dash: all
        DashUITests: [test]
    test:
      targets:
        - DashUITests

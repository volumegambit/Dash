# Hosted relay + control plane behind an existing Traefik v3 (docker provider,
# external network "traefik", a DNS-01 cert resolver for the wildcard zone).
# Configure via .env — see .env.example. Deploy with ./deploy.sh <image>.
services:
  relay:
    image: ${DASH_SERVER_IMAGE:?set DASH_SERVER_IMAGE (deploy.sh writes it)}
    command: ["node", "apps/relay/dist/main.js"]
    restart: unless-stopped
    environment:
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: "8443"
      RELAY_ADMIN_SECRET: ${ADMIN_SECRET:?set ADMIN_SECRET}
      RELAY_DIAL_TOKEN_PUBLIC_KEY: /secrets/dial-token.pub
      RELAY_STORE_PATH: /data/relay-creds.db
    volumes:
      - ./data/relay:/data
      - ./secrets:/secrets:ro
    networks: [traefik, internal]
    healthcheck:
      # The relay answers 404 on non-mobile paths — any HTTP answer means it is up.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8443/').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.dash-relay.rule: "HostRegexp(`^[a-z0-9-]+\\.${RELAY_ZONE}$$`)"
      traefik.http.routers.dash-relay.priority: "10"
      traefik.http.routers.dash-relay.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.dash-relay.tls: "true"
      traefik.http.routers.dash-relay.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-cfdns}
      traefik.http.routers.dash-relay.tls.domains[0].main: ${RELAY_ZONE}
      traefik.http.routers.dash-relay.tls.domains[0].sans: "*.${RELAY_ZONE}"
      traefik.http.services.dash-relay.loadbalancer.server.port: "8443"

  cp:
    image: ${DASH_SERVER_IMAGE:?set DASH_SERVER_IMAGE (deploy.sh writes it)}
    command: ["node", "apps/relay-control-plane/dist/main.js"]
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      RELAY_CP_HOST: 0.0.0.0
      RELAY_CP_PORT: "9400"
      RELAY_CP_DB_PATH: /data/control-plane.db
      RELAY_CP_RELAY_ADMIN_URL: http://relay:8443
      RELAY_CP_RELAY_ADMIN_SECRET: ${ADMIN_SECRET:?set ADMIN_SECRET}
      RELAY_CP_RELAY_ZONE: ${RELAY_ZONE:?set RELAY_ZONE}
      RELAY_CP_DIAL_TOKEN_PRIVATE_KEY: /secrets/dial-token.key
      RELAY_CP_CLERK_FRONTEND_API: ${CLERK_FRONTEND_API:?set CLERK_FRONTEND_API}
      RELAY_CP_CLERK_CLIENT_ID: ${CLERK_CLIENT_ID:?set CLERK_CLIENT_ID}
      RELAY_CP_WEB_ORIGINS: ${WEB_ORIGINS:-}
    volumes:
      - ./data/cp:/data
      - ./secrets:/secrets:ro
    networks: [traefik, internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9400/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.dash-cp.rule: "Host(`${CP_HOST}`)"
      traefik.http.routers.dash-cp.priority: "100"
      traefik.http.routers.dash-cp.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.dash-cp.tls: "true"
      traefik.http.routers.dash-cp.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-cfdns}
      traefik.http.services.dash-cp.loadbalancer.server.port: "9400"

networks:
  traefik:
    external: true
  internal: {}
